name: GCC

on:
  push:
    paths-ignore:
      - 'sql/**'    
  pull_request:
    paths-ignore:
      - 'sql/**'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    if: ${{ !github.event.pull_request.draft }}
    steps:
    - name: Dependencies
      run: |
        apt-get update
        apt-get install -yq --no-install-recommends build-essential ca-certificates cmake git \
          libboost-dev libboost-filesystem-dev libboost-iostreams-dev libboost-locale-dev \
          libboost-program-options-dev libboost-regex-dev libbz2-dev libmysqlclient-dev \
          libreadline-dev libssl-dev pkg-config python3 zlib1g-dev
    - uses: actions/checkout@v4
    - name: Setup
      run: |
        cmake -S . -B bin -DTOOLS=1 -DELUNA=0 -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/bin/check_install"
    - name: Build
      run: |
        cmake --build bin --parallel 4
        cmake --build bin --target openssl_compatibility --parallel 4
        cmake --install bin
    - name: Regression tests
      run: |
        ./bin/bin/openssl_compatibility
        python3 contrib/tests/database_startup_retry_regression.py
        python3 contrib/tests/playerbot_multilevel_soak_regression.py
    - name: Class AI regression tests (ASan/UBSan)
      run: |
        cmake -S contrib/diagnostics/sanitizer_regression -B bin/regression \
          -DLOA_SOURCE_DIR="$GITHUB_WORKSPACE" -DCMAKE_CXX_COMPILER=/usr/bin/g++
        ctest --test-dir bin/regression -L class-ai --output-on-failure --parallel 2
    - name: Check executables
      run: |
        ./bin/check_install/bin/authserver --version
        ./bin/check_install/bin/worldserver --version
